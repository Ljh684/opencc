name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: moon version

      - name: Type check
        run: moon check

      - name: Unit tests
        # wasm-gc is the module's preferred target; the plain wasm test binary
        # exceeds the backend's local limit with the full data set (see
        # docs/performance.md).
        run: moon test --target wasm-gc

      - name: Build all targets
        run: |
          moon build --target wasm-gc --release
          moon build --target js --release
          moon build --target native --release

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify generated data is up to date
        run: moon run tools/gen_dict -- --verify

      - name: Official golden corpus
        run: moon run cmd/opencc -- verify --golden test/fixtures/golden
