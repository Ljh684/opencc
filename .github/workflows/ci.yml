name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keep CI reproducible with the toolchain used to validate this snapshot.
# Update deliberately when the project adopts a newer MoonBit release.
env:
  MOONBIT_INSTALL_VERSION: "0.1.20260920"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: moon version

      - name: Type check
        run: moon check

      - name: Unit tests
        # All four backends run the suite; with the text-block data format each
        # one takes seconds (see docs/performance.md).
        run: |
          for target in wasm wasm-gc js native; do
            echo "::group::moon test --target $target"
            moon test --target "$target"
            echo "::endgroup::"
          done

      - name: Build all targets
        run: |
          moon build --target wasm-gc --release
          moon build --target js --release
          moon build --target native --release

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify generated data is up to date
        run: moon run tools/gen_dict -- --verify

      - name: Official golden corpus
        run: moon run cmd/opencc -- verify --golden test/fixtures/golden
