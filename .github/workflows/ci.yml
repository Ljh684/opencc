name: CI

on:
  push:
    branches: [main]
  pull_request:

# The snapshot was validated with this toolchain. The download server only serves
# the `latest` and `nightly` channels — version-numbered directories return 404 —
# so the version cannot be pinned through MOONBIT_INSTALL_VERSION. The workflow
# installs the default channel and warns (instead of failing) when it moved; the
# real gates are check, tests, generated-data verification and the golden corpus.
env:
  VALIDATED_MOON_VERSION: "0.1.20260920"

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        # Two things are handled here because both broke earlier runs:
        #   * the installer hardcodes the .cn download host, which timed out from a
        #     GitHub runner (curl error 28 after 300 s), so both hosts are tried;
        #   * `curl … | bash` reports the exit status of bash, so a failed download
        #     still looked like a green step — now the toolchain is verified by
        #     running `moon version` before the step is allowed to pass.
        run: |
          set -euo pipefail
          for host in https://cli.moonbitlang.com https://cli.moonbitlang.cn; do
            echo "::group::install from $host"
            if curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 900 "$host/install/unix.sh" -o /tmp/moonbit-install.sh; then
              sed -i "s#https://cli.moonbitlang.cn#$host#g" /tmp/moonbit-install.sh
              if bash /tmp/moonbit-install.sh; then
                echo "::endgroup::"
                echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
                "$HOME/.moon/bin/moon" version
                exit 0
              fi
            fi
            echo "::endgroup::"
            echo "::warning::$host did not provide a toolchain; trying the next host"
          done
          echo "::error::could not install the MoonBit toolchain from any host"
          exit 1

      - name: Update package registry
        # A fresh runner has no registry index, and `moon check` needs one to
        # resolve the `moonbitlang/x` dependency of the CLI and the tools.
        run: moon update

      - name: Toolchain version
        run: |
          moon version
          if ! moon version | grep -q "$VALIDATED_MOON_VERSION"; then
            echo "::warning title=MoonBit toolchain changed::Installed version is not $VALIDATED_MOON_VERSION. Re-validate the snapshot and update VALIDATED_MOON_VERSION deliberately."
          fi

      - name: Type check
        run: moon check

      - name: Unit tests
        # All four backends run the suite; with the text-block data format each one
        # takes seconds (see docs/performance.md).
        run: |
          for target in wasm wasm-gc js native; do
            echo "::group::moon test --target $target"
            moon test --target "$target"
            echo "::endgroup::"
          done

      - name: Build all targets
        run: |
          moon build --target wasm --release
          moon build --target wasm-gc --release
          moon build --target js --release
          moon build --target native --release

      - name: Verify generated data is up to date
        # Native, because the generator reads files; it checks the snapshot's
        # SHA-256 records and regenerates every module in memory.
        run: moon run tools/gen_dict --target native -- --verify

      - name: Official golden corpus
        # Native for the same reason: the CLI reads the corpus from disk.
        run: moon run cmd/opencc --target native -- verify --golden test/fixtures/golden

      - name: Example builds (size-sensitive consumers)
        run: |
          moon build examples/t2s --target wasm-gc --release
          moon build examples/s2t --target wasm-gc --release
          moon build examples/web --target js --release
          node examples/web/demo.mjs
