name: CI

on:
  push:
    branches: [main]
  pull_request:

# The MoonBit download server only publishes the `latest` and `nightly` channels:
# version-numbered directories return 404 (checked: binaries/0.1.20260920/... and
# binaries/0.1.20260920%2B914d7da/... both 404, while latest and nightly are 200).
# Setting MOONBIT_INSTALL_VERSION to a version string therefore breaks the install
# — that is what made this workflow red — so the toolchain is installed from
# `latest` and the version actually installed is printed and compared below.
# Real gates are check, tests, generated-data verification and the golden corpus.
env:
  VALIDATED_MOON_VERSION: "0.1.20260920"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: |
          moon version
          if ! moon version | grep -q "$VALIDATED_MOON_VERSION"; then
            echo "::warning title=MoonBit toolchain changed::Installed version is not $VALIDATED_MOON_VERSION. Re-run the snapshot validation and update VALIDATED_MOON_VERSION deliberately."
          fi

      - name: Type check
        run: moon check

      - name: Unit tests
        # All four backends run the suite; with the text-block data format each
        # one takes seconds (see docs/performance.md).
        run: |
          for target in wasm wasm-gc js native; do
            echo "::group::moon test --target $target"
            moon test --target "$target"
            echo "::endgroup::"
          done

      - name: Build all targets
        run: |
          moon build --target wasm-gc --release
          moon build --target js --release
          moon build --target native --release

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: moon version

      - name: Verify generated data is up to date
        run: moon run tools/gen_dict -- --verify

      - name: Official golden corpus
        run: moon run cmd/opencc -- verify --golden test/fixtures/golden
